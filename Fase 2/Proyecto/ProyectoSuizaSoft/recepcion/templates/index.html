<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUIZASOFT - Acceso Operarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0d1117; color: #cdd9e5; }
        .card-login { background-color: rgba(18, 22, 28, 0.96); border: 1px solid #3f444a; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .texto-acento { color: #238636; }
        .form-control { background-color: #0a0d12 !important; color: #cdd9e5 !important; border: 1px solid #3f444a !important; padding: 10px 15px; }
        .form-control:focus { border-color: #238636 !important; box-shadow: 0 0 0 2px rgba(35, 134, 54, 0.4) !important; }
        .btn-success { background-color: #238636; border: none; font-size: 1.05rem; letter-spacing: 0.5px; }
        .btn-success:hover { background-color: #2ea043; }
        .logo-text { letter-spacing: 2px; font-size: 2.2rem; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">
    <div class="container" style="max-width: 400px;">
        <div class="text-center mb-4">
            <h2 class="fw-bold logo-text">SUIZA<span class="texto-acento">SOFT</span></h2>
            <p class="text-secondary"><i class="fas fa-microscope me-2"></i>Módulo de Calidad</p>
        </div>

        <div class="card card-login p-4 rounded-4">
            {% if error %}
            <div class="alert alert-danger p-2 text-center small bg-danger text-white border-0">
                <i class="fas fa-exclamation-triangle me-2"></i>{{ error }}
            </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label text-secondary small fw-bold">
                        <i class="fas fa-user me-2"></i>USUARIO
                    </label>
                    <input type="text" class="form-control" name="usuario" required
                           autocomplete="off" placeholder="Ej: plc_sag">
                </div>
                <div class="mb-4">
                    <label class="form-label text-secondary small fw-bold">
                        <i class="fas fa-key me-2"></i>CONTRASEÑA
                    </label>
                    <input type="password" class="form-control" name="clave" required>
                </div>
                <button type="submit" class="btn btn-success w-100 fw-bold py-2 mt-2">
                    Ingresar al Sistema
                </button>
            </form>
        </div>
    </div>
</body>
</html>
